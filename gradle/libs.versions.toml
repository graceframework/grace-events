[versions]
bytebuddy = "1.15.11"
gpars = "1.2.1"
grace-data = "2024.0.0-RC1"
grace-gradle = "2024.0.0-RC1"
gradle-nexus-publish = "2.0.0"
gradle-test-retry = "1.6.2"
groovy = "4.0.30"
jakarta-annotation = "2.1.1"
javaparser = "3.26.4"
junit-jupiter = "5.11.4"
junit-platform = "1.11.4"
objenesis = "3.4"
rxjava = "1.3.8"
rxjava2 = "2.2.21"
rxjava3 = "3.1.12"
slf4j = "2.0.17"
spock = "2.3-groovy-4.0"
spring-framework = "6.2.17"

[libraries]
bytebuddy = { module = "net.bytebuddy:byte-buddy", version.ref = "bytebuddy" }
gpars = { module = "org.codehaus.gpars:gpars", version.ref = "gpars" }
grace-datastore-core = { module = "org.graceframework:grace-datastore-core", version.ref = "grace-data" }
grace-datastore-gorm = { module = "org.graceframework:grace-datastore-gorm", version.ref = "grace-data" }
grace-datastore-gorm-async = { module = "org.graceframework:grace-datastore-gorm-async", version.ref = "grace-data" }
grace-datastore-gorm-support = { module = "org.graceframework:grace-datastore-gorm-support", version.ref = "grace-data" }
grace-datastore-gorm-tck = { module = "org.graceframework:grace-datastore-gorm-tck", version.ref = "grace-data" }
grace-datastore-gorm-test = { module = "org.graceframework:grace-datastore-gorm-test", version.ref = "grace-data" }
grace-datastore-gorm-validation = { module = "org.graceframework:grace-datastore-gorm-validation", version.ref = "grace-data" }
grace-datastore-web = { module = "org.graceframework:grace-datastore-web", version.ref = "grace-data" }
groovy-ant = { module = "org.apache.groovy:groovy-ant", version.ref = "groovy" }
groovy-core = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
groovy-test = { module = "org.apache.groovy:groovy-test", version.ref = "groovy" }
groovy-test-junit5 = { module = "org.apache.groovy:groovy-test-junit5", version.ref = "groovy" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta-annotation" }
javaparser = { module = "com.github.javaparser:javaparser-core", version.ref = "javaparser" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-platform-engine = { module = "org.junit.platform:junit-platform-engine", version.ref = "junit-platform" }
junit-platform-runner = { module = "org.junit.platform:junit-platform-runner", version.ref = "junit-platform" }
objenesis = { module = "org.objenesis:objenesis", version.ref = "objenesis" }
rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }
rxjava2 = { module = "io.reactivex.rxjava2:rxjava", version.ref = "rxjava2" }
rxjava3 = { module = "io.reactivex.rxjava3:rxjava", version.ref = "rxjava3" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-jcl = { module = "org.slf4j:jcl-over-slf4j", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock" }
spock-spring = { module = "org.spockframework:spock-spring", version.ref = "spock" }
spring-aop = { module = "org.springframework:spring-aop", version.ref = "spring-framework" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring-framework" }
spring-core = { module = "org.springframework:spring-core", version.ref = "spring-framework" }
spring-expression = { module = "org.springframework:spring-expression", version.ref = "spring-framework" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring-framework" }
spring-tx = { module = "org.springframework:spring-tx", version.ref = "spring-framework" }
spring-web = { module = "org.springframework:spring-web", version.ref = "spring-framework" }

[plugins]
grace-doc = { id = "org.graceframework.grace-doc", version.ref = "grace-gradle" }
gradle-nexus-publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "gradle-nexus-publish" }
gradle-test-retry = { id = "org.gradle.test-retry", version.ref = "gradle-test-retry" }